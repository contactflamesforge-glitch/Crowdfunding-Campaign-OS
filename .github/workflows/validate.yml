name: Validate application

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q app.py
      - name: Extract and validate browser component JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("jarvis_component/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">\s*(.*?)\s*</script>', source, re.S)
          if not match:
              raise SystemExit("Could not find the J.A.R.V.I.S. module script.")
          Path("/tmp/jarvis-component.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/jarvis-component.mjs
