name: Python validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q .
      - name: Check J.A.R.V.I.S. browser JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path("jarvis_component/index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">\s*(.*?)\s*</script>', source, re.S)
          if not match:
              raise SystemExit("Could not find the J.A.R.V.I.S. module script.")
          Path("/tmp/jarvis-component.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/jarvis-component.mjs
